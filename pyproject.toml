[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-local-memory"
version = "0.2.2"
description = "Local-first SQLite memory provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Hermes Local Memory contributors" }
]
keywords = ["hermes", "memory", "agent", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/smarzola/hermes-local-memory"
Repository = "https://github.com/smarzola/hermes-local-memory"
Issues = "https://github.com/smarzola/hermes-local-memory/issues"
Changelog = "https://github.com/smarzola/hermes-local-memory/releases"

[project.scripts]
hermes-local-memory = "hermes_local_memory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.hatch.build]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/docs",
  "/skills",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_local_memory"]
force-include = { "skills" = "skills", "docs" = "docs", "CHANGELOG.md" = "CHANGELOG.md" }
